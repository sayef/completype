name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets
        env:
          GITLEAKS: "8.21.2"
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS}_checksums.txt" | sha256sum -c --ignore-missing
          tar xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features completype/aws-credentials,completype/gcp,completype/azure -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: --warn unmaintained

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --features completype/store

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p completype-vector
      - run: cargo test --release -p completype
      - run: cargo test --release -p completype --features store
      - run: cargo test --release -p completype --doc --features store

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin pytest numpy pandas pyarrow
      - run: maturin build --release --locked -o dist
      - run: pip install --no-index --find-links dist completype
      - run: pytest crates/completype-py/tests
      - run: python crates/completype-py/examples/quickstart.py && python crates/completype-py/examples/live_updates.py && python crates/completype-py/examples/layers.py

  # The release builds this wheel too; importing it on Alpine catches what only musl's loader refuses.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: musllinux_1_2
          args: --release --locked --out dist
      - run: |
          docker run --rm -v "$PWD/dist:/dist:ro" python:3.12-alpine sh -c '
            pip install -q --no-index --find-links /dist completype &&
            python -c "import completype; i = completype.Index.from_documents([{\"id\": 1, \"text\": \"Bohemian Rhapsody\"}]); assert [s.text for s in i.complete(\"bohemain\")] == [\"Bohemian Rhapsody\"]"'
