{% extends "base.html" %}

{% block extrahead %}
{% if page %}
  {% set title = config.site_name if page.is_homepage else page.title ~ " · " ~ config.site_name %}
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121210">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ page.meta.description or config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="completype: serverless autocompletion for Rust and Python">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/social-preview.png">
{% endif %}
{% endblock %}
