[package]
name = "completype-fts"
description = "Full-text search with exact BM25 top-k over compressed, memory-mapped segments"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
fst = "0.4"
frostem = { version = "2.20261016", default-features = false, features = ["arabic", "armenian", "basque", "catalan", "czech", "danish", "dutch", "english", "esperanto", "estonian", "finnish", "french", "german", "greek", "hindi", "hungarian", "indonesian", "irish", "italian", "lithuanian", "nepali", "norwegian", "persian", "polish", "portuguese", "romanian", "russian", "serbian", "sesotho", "spanish", "swedish", "tamil", "turkish", "ukrainian", "yiddish"] }
memmap2 = "0.9"
rustc-hash = "2"
rayon = "1.10"
unicode-normalization = "0.1"
zstd = "0.14"

[dev-dependencies]
